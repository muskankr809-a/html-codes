<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Ordered List</h2>
    <ol type="A">
        <li>Notebook</li>
        <li>Pen</li>
        <li>Book</li>
    </ol>

    <ol type="a">
    <li>Story</li>
    <li>Pome</li>
     </ol>


    <h2>Unordered List</h2>
    <ul type="square">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

     <ul type="circle">
        <li>React</li>
        <li>NodeJs</li>
        <li>DSA</li>
    </ul>

    <h2>Nested List</h2>
    <ul>
        <li>Programming
            <ol type="1">
                <li>C++</li>
                <li>Java</li>
                <li>Python</li>
            </ol>
        </li>
        <li>Web Development</li>
        <ol type="i">
            <li>HTML</li>
            <li>CSS</li>
        </ol>
    </ul>

</body>
</html>
